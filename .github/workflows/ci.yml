name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test library
        run: ./gradlew :charts:desktopTest
      - name: Compile Android gallery
        run: ./gradlew :androidApp:assembleDebug
      - name: Compile Wasm gallery
        run: ./gradlew :example:wasmJsBrowserDistribution
      - name: Validate local publication
        run: ./gradlew :charts:publishToMavenLocal

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile iOS simulator library
        run: ./gradlew :charts:compileKotlinIosSimulatorArm64
